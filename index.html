<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Information -->
    <title>ScoreViewer</title>
    <meta name="author" content="aidanelm" />
    <meta
      name="description"
      content="Provides scores for certain Pennsylvania sports teams."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <main class="container pb-4">
      <div class="row g-3">
        <!-- Philadelphia Phillies — MLB -->
        <div class="col-md-6 col-lg-4">
          <div class="score-card" style="background: #c8102e; color: #fff">
            <div class="team-name">Philadelphia Phillies</div>
            <div class="matchup" id="phillies">
              <span class="loading">Loading...</span>
            </div>
          </div>
        </div>

        <!-- Philadelphia 76ers — NBA -->
        <div class="col-md-6 col-lg-4">
          <div class="score-card" style="background: #006bb6; color: #fff">
            <div class="team-name">Philadelphia 76ers</div>
            <div class="matchup" id="sixers">
              <span class="loading">Loading...</span>
            </div>
          </div>
        </div>

        <!-- Philadelphia Eagles — NFL -->
        <div class="col-md-6 col-lg-4">
          <div class="score-card" style="background: #004c54; color: #fff">
            <div class="team-name">Philadelphia Eagles</div>
            <div class="matchup" id="eagles">
              <span class="loading">Loading...</span>
            </div>
          </div>
        </div>

        <!-- Philadelphia Flyers — NHL -->
        <div class="col-md-6 col-lg-4">
          <div class="score-card" style="background: #f74902; color: #fff">
            <div class="team-name">Philadelphia Flyers</div>
            <div class="matchup" id="flyers">
              <span class="loading">Loading...</span>
            </div>
          </div>
        </div>

        <!-- Philadelphia Union — MLS - Different API -->
        <div class="col-md-6 col-lg-4">
          <div class="score-card" style="background: #071b2c; color: #fff">
            <div class="team-name">Philadelphia Union</div>
            <div class="matchup" id="union">
              <span class="loading">Loading...</span>
            </div>
          </div>
        </div>

        <!-- St. Joseph's Hawks — Men's College Basketball -->
        <div class="col-md-6 col-lg-4">
          <div class="score-card" style="background: #9e1b32; color: #fff">
            <div class="team-name">Saint Joseph's Men's Basketball</div>
            <div class="matchup" id="sju">
              <span class="loading">Loading...</span>
            </div>
          </div>
        </div>

        <!-- West Chester Golden Rams — College Football -->
        <div class="col-md-6 col-lg-4">
          <div class="score-card" style="background: #512d6d; color: #fff">
            <div class="team-name">West Chester Football</div>
            <div class="matchup" id="wcu">
              <span class="loading">Loading...</span>
            </div>
          </div>
        </div>
      </div>

      <div class="footer">ScoreViewer</div>
    </main>

    <!-- JavaScript Functionality -->
    <script src="main.js"></script>
  </body>
</html>
